<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residentie HELIX - Test Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="padding: 40px; font-family: Arial, sans-serif;">
        <h1>Residentie HELIX - Quick Test</h1>
        <p>Als u dit ziet, werkt het dashboard!</p>
        
        <div style="margin: 20px 0; padding: 20px; background: #f0f0f0; border-radius: 10px;">
            <h2>Test Info:</h2>
            <p>✅ HTML geladen</p>
            <p>✅ Chart.js beschikbaar</p>
            <p id="status">⏳ Data wordt geladen...</p>
        </div>
        
        <div style="width: 400px; height: 400px;">
            <canvas id="testChart"></canvas>
        </div>
    </div>
    
    <script>
        // Test data - geen API nodig!
        const testData = {
            labels: ['VENNOOTSCHAP MDN', 'LUMINUS', 'FARYS', 'OVERIG'],
            datasets: [{
                label: 'Uitgaven',
                data: [151121, 133047, 37751, 271840],
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0']
            }]
        };
        
        // Maak test grafiek
        window.onload = function() {
            document.getElementById('status').innerHTML = '✅ Dashboard werkt perfect!';
            
            const ctx = document.getElementById('testChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: testData,
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Test Uitgaven Grafiek'
                        }
                    }
                }
            });
        };
    </script>
</body>
</html>
