<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residentie HELIX - Waar Gaat Uw Geld Naartoe?</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .period-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }
        
        /* KPI Cards */
        .kpi-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .kpi-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }
        
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
        }
        
        .kpi-card.income::before {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
        }
        
        .kpi-card.expense::before {
            background: linear-gradient(90deg, #ef4444 0%, #f87171 100%);
        }
        
        .kpi-card.warning::before {
            background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
        }
        
        .kpi-card.special::before {
            background: linear-gradient(90deg, #8b5cf6 0%, #a78bfa 100%);
        }
        
        .kpi-label {
            font-size: 0.9em;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .kpi-value {
            font-size: 2em;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
        }
        
        .kpi-detail {
            font-size: 0.85em;
            color: #94a3b8;
        }
        
        .kpi-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2em;
            opacity: 0.1;
        }
        
        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            height: 400px;
        }
        
        .chart-container canvas {
            max-height: 350px !important;
        }
        
        .chart-container.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #1e293b;
        }
        
        .chart-info {
            font-size: 0.85em;
            color: #64748b;
            cursor: help;
        }
        
        /* Tabs */
        .tabs-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .tabs-header {
            display: flex;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .tab-button {
            padding: 15px 25px;
            border: none;
            background: none;
            font-size: 0.95em;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            position: relative;
        }
        
        .tab-button:hover {
            color: #3b82f6;
            background: #f1f5f9;
        }
        
        .tab-button.active {
            color: #3b82f6;
            background: white;
        }
        
        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #3b82f6;
        }
        
        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Pivot Tables */
        .pivot-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }
        
        .pivot-table th {
            background: #f8fafc;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .pivot-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .pivot-table tbody tr {
            transition: background-color 0.2s ease;
        }
        
        .pivot-table tr[onclick] {
            cursor: pointer;
            user-select: none;
        }
        
        .pivot-table tr[onclick]:hover {
            background: #f1f5f9 !important;
        }
        
        .pivot-table tr.category-header:hover {
            background: #e2e8f0;
        }
        
        .pivot-table tr.sub-row:hover {
            background: #f1f5f9;
        }
        
        .pivot-table tr.detail-row:hover {
            background: #f8f9fa;
        }
        
        .pivot-table .amount {
            text-align: right;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-weight: 500;
        }
        
        .pivot-table .percentage {
            color: #64748b;
            font-size: 0.9em;
        }
        
        .pivot-table .clickable {
            cursor: pointer;
            color: #3b82f6;
            transition: all 0.2s ease;
        }
        
        .pivot-table .clickable:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        
        .pivot-table .expanded {
            background: #f8fafc;
        }
        
        .pivot-table .sub-row {
            background: #fafbfc;
        }
        
        .pivot-table .sub-row td:first-child {
            padding-left: 40px;
        }
        
        .pivot-table .detail-row {
            background: #fcfcfd;
            font-size: 0.9em;
        }
        
        .pivot-table .detail-row td:first-child {
            padding-left: 60px;
        }
        
        .category-header {
            font-weight: 600;
            background: #f1f5f9;
        }
        
        .expand-icon {
            display: inline-block;
            width: 20px;
            transition: transform 0.2s ease;
        }
        
        .expand-icon.expanded {
            transform: rotate(90deg);
        }
        
        /* MDN Highlight */
        .mdn-highlight {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-left: 4px solid #f59e0b;
        }
        
        /* RVM Highlight */
        .rvm-highlight {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border-left: 4px solid #3b82f6;
        }
        
        /* Cash Highlight */
        .cash-highlight {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border-left: 4px solid #22c55e;
        }
        
        .mdn-row {
            font-weight: 600;
            background: #fffbeb;
        }
        
        /* Search */
        .search-container {
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* Info Box */
        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .info-box-icon {
            font-size: 1.5em;
            color: #3b82f6;
        }
        
        .info-box-text {
            flex: 1;
            font-size: 0.95em;
            color: #1e40af;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            color: #64748b;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .kpi-section {
                grid-template-columns: 1fr;
            }
            
            .tabs-header {
                display: block;
            }
            
            .tab-button {
                display: block;
                width: 100%;
                text-align: left;
                border-bottom: 1px solid #e2e8f0;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .pivot-table {
                font-size: 0.85em;
            }
            
            .pivot-table td, .pivot-table th {
                padding: 8px 10px;
            }
        }
        
        /* Download Button */
        .download-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        /* Transaction Details Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .modal-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #1e293b;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .close-btn:hover {
            color: #1e293b;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Waar Gaat Uw Geld Naartoe?</h1>
            <p class="subtitle">Residentie HELIX - Volledig Transparant Financieel Overzicht</p>
            <div class="period-info">
                <strong>Periode:</strong> 14 maart 2024 - 14 maart 2025
            </div>
        </header>
        
        <!-- KPI Section -->
        <div class="kpi-section" id="kpiSection">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Dashboard wordt geladen...</div>
            </div>
        </div>
        
        <!-- Charts Section -->
        <div class="charts-grid" id="chartsSection"></div>
        
        <!-- Tabs Section -->
        <div class="tabs-container" id="tabsSection"></div>
        
        <!-- Modal for transaction details -->
        <div id="transactionModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Transactie Details</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Global variables
        let allData = [];
        let operationalExpenses = [];
        let charts = {};
        
        // Initialize dashboard
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                await loadData();
                renderKPIs();
                renderCharts();
                renderTabs();
            } catch (error) {
                console.error('Error initializing dashboard:', error);
                document.getElementById('kpiSection').innerHTML = 
                    '<div class="info-box"><div class="info-box-icon">⚠️</div><div class="info-box-text">Er is een fout opgetreden bij het laden van de data. Probeer de pagina te vernieuwen.</div></div>';
            }
        });
        
        // Load and parse CSV data
        async function loadData() {
            const response = await fetch('BANKAFSCHRIFTEN_DATA_ENRICHED.csv');
            const csvText = await response.text();
            
            const result = Papa.parse(csvText, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true
            });
            
            allData = result.data;
            operationalExpenses = allData.filter(row => row['Boekhoudkunidg Type'] === 'OPERATIONELE UITGAVE');
            
            console.log('Data loaded:', allData.length, 'transactions');
            console.log('Operational expenses:', operationalExpenses.length, 'transactions');
        }
        
        // Render KPI cards
        function renderKPIs() {
            const totaalInkomend = _.sumBy(allData, 'Bedrag Inkomend') || 0;
            const totaalUitgaand = Math.abs(_.sumBy(allData, 'Bedrag Uitgaand')) || 0;
            const totaalOperationeel = _.sumBy(operationalExpenses, 'Transactie Bedrag');
            
            // Calculate MDN total
            const mdnExpenses = operationalExpenses.filter(row => row['Hoofdcategorie'] === 'VENNOOTSCHAPPEN MDN');
            const mdnTotal = _.sumBy(mdnExpenses, 'Transactie Bedrag');
            const mdnPercentage = (mdnTotal / totaalOperationeel * 100).toFixed(1);
            
            // Calculate other special expenses
            const investeringLiften = _.sumBy(allData.filter(row => row['Boekhoudkunidg Type'] === 'INVESTERING NIEUWE LIFTEN'), 'Transactie Bedrag');
            const jaarafrekeningEigenaars = _.sumBy(allData.filter(row => row['Boekhoudkunidg Type'] === 'JAARAFREKENING EIGENAARS'), 'Transactie Bedrag');
            
            // Get latest balance
            const sortedByDate = _.sortBy(allData, row => {
                const parts = row['Transactie Datum'].split('/');
                return new Date(parts[2], parts[1]-1, parts[0]);
            });
            const latestBalance = sortedByDate[sortedByDate.length - 1]['Saldo na Transactie'];
            
            const kpiHTML = `
                <div class="kpi-card income">
                    <div class="kpi-icon">💰</div>
                    <div class="kpi-label">Totaal Ontvangen</div>
                    <div class="kpi-value">€ ${formatNumber(totaalInkomend)}</div>
                    <div class="kpi-detail">Voornamelijk voorschotten eigenaars</div>
                </div>
                
                <div class="kpi-card expense">
                    <div class="kpi-icon">💸</div>
                    <div class="kpi-label">Totaal Uitgegeven</div>
                    <div class="kpi-value">€ ${formatNumber(totaalUitgaand)}</div>
                    <div class="kpi-detail">Alle uitgaven samen</div>
                </div>
                
                <div class="kpi-card">
                    <div class="kpi-icon">🏦</div>
                    <div class="kpi-label">Huidig Saldo</div>
                    <div class="kpi-value">€ ${formatNumber(latestBalance)}</div>
                    <div class="kpi-detail">Stand bankrekening</div>
                </div>
                
                <div class="kpi-card warning">
                    <div class="kpi-icon">🏢</div>
                    <div class="kpi-label">Beheerkosten (MDN)</div>
                    <div class="kpi-value">€ ${formatNumber(mdnTotal)}</div>
                    <div class="kpi-detail">${mdnPercentage}% van operationele kosten</div>
                </div>
                
                <div class="kpi-card special">
                    <div class="kpi-icon">🛗</div>
                    <div class="kpi-label">Investering Liften</div>
                    <div class="kpi-value">€ ${formatNumber(investeringLiften)}</div>
                    <div class="kpi-detail">Vernieuwing liftinstallaties</div>
                </div>
                
                <div class="kpi-card special">
                    <div class="kpi-icon">📊</div>
                    <div class="kpi-label">Terugbetaling Eigenaars</div>
                    <div class="kpi-value">€ ${formatNumber(jaarafrekeningEigenaars)}</div>
                    <div class="kpi-detail">Jaarafrekening overschotten</div>
                </div>
            `;
            
            document.getElementById('kpiSection').innerHTML = kpiHTML;
        }
        
        // Render charts
        function renderCharts() {
            const chartsHTML = `
                <div class="chart-container">
                    <div class="chart-header">
                        <h3 class="chart-title">Waar Gaan de Operationele Kosten Naartoe?</h3>
                        <span class="chart-info" title="Klik op een segment voor details">ℹ️</span>
                    </div>
                    <canvas id="operationalPieChart" style="max-height: 300px;"></canvas>
                </div>
                
                <div class="chart-container">
                    <div class="chart-header">
                        <h3 class="chart-title">Top 10 Grootste Uitgaven</h3>
                        <span class="chart-info" title="Alle leveranciers op bedrag">ℹ️</span>
                    </div>
                    <canvas id="topSuppliersChart" style="max-height: 300px;"></canvas>
                </div>
                
                <div class="chart-container full-width">
                    <div class="chart-header">
                        <h3 class="chart-title">Maandelijkse Uitgaven Trend</h3>
                        <span class="chart-info" title="Operationele uitgaven per maand">ℹ️</span>
                    </div>
                    <canvas id="monthlyTrendChart" style="max-height: 200px;"></canvas>
                </div>
            `;
            
            document.getElementById('chartsSection').innerHTML = chartsHTML;
            
            // Create pie chart for operational expenses
            createOperationalPieChart();
            
            // Create top suppliers chart
            createTopSuppliersChart();
            
            // Create monthly trend chart
            createMonthlyTrendChart();
        }
        
        // Create operational expenses pie chart
        function createOperationalPieChart() {
            const categoryTotals = _(operationalExpenses)
                .groupBy('Hoofdcategorie')
                .mapValues(group => _.sumBy(group, 'Transactie Bedrag'))
                .toPairs()
                .sortBy(pair => -pair[1])
                .value();
            
            const ctx = document.getElementById('operationalPieChart').getContext('2d');
            
            charts.operationalPie = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: categoryTotals.map(([cat, total]) => {
                        const percentage = (total / _.sumBy(operationalExpenses, 'Transactie Bedrag') * 100).toFixed(1);
                        return `${cat} (${percentage}%)`;
                    }),
                    datasets: [{
                        data: categoryTotals.map(([cat, total]) => total),
                        backgroundColor: categoryTotals.map(([cat, total], index) => {
                            if (cat === 'VENNOOTSCHAPPEN MDN') return '#f59e0b';
                            const colors = ['#3b82f6', '#10b981', '#8b5cf6', '#ef4444', '#14b8a6', '#f43f5e', '#84cc16', '#06b6d4', '#a855f7', '#f97316'];
                            return colors[index % colors.length];
                        }),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 15,
                                font: {
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    return `€ ${formatNumber(value)}`;
                                }
                            }
                        }
                    },
                    onClick: function(event, elements) {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const category = categoryTotals[index][0];
                            showCategoryDetails(category);
                        }
                    }
                }
            });
        }
        
        // Create top suppliers chart
        function createTopSuppliersChart() {
            const supplierTotals = _(operationalExpenses)
                .groupBy('Subcategorie (Levarancier/Ontvanger)')
                .mapValues(group => ({
                    total: _.sumBy(group, 'Transactie Bedrag'),
                    category: group[0]['Hoofdcategorie']
                }))
                .toPairs()
                .sortBy(pair => -pair[1].total)
                .take(10)
                .value();
            
            const ctx = document.getElementById('topSuppliersChart').getContext('2d');
            
            charts.topSuppliers = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: supplierTotals.map(([supplier]) => supplier),
                    datasets: [{
                        label: 'Totaal Bedrag',
                        data: supplierTotals.map(([supplier, data]) => data.total),
                        backgroundColor: supplierTotals.map(([supplier, data]) => {
                            if (data.category === 'VENNOOTSCHAPPEN MDN') return '#f59e0b';
                            return '#3b82f6';
                        }),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,

        // Update categories content
        function updateCategoriesContent() {
            const totaalOperationeel = _.sumBy(operationalExpenses, 'Transactie Bedrag');
            
            const categoriesData = _(operationalExpenses)
                .groupBy('Hoofdcategorie')
                .mapValues((group, category) => {
                    const suppliers = _(group)
                        .groupBy('Subcategorie (Levarancier/Ontvanger)')
                        .mapValues(supplierGroup => ({
                            transactions: supplierGroup,
                            total: _.sumBy(supplierGroup, 'Transactie Bedrag'),
                            count: supplierGroup.length
                        }))
                        .value();
                    
                    return {
                        total: _.sumBy(group, 'Transactie Bedrag'),
                        count: group.length,
                        suppliers: suppliers
                    };
                })
                .toPairs()
                .sortBy(pair => -pair[1].total)
                .value();
            
            let tableHTML = `<table class="pivot-table">
                <thead>
                    <tr>
                        <th>Categorie / Leverancier / Transactie</th>
                        <th class="amount">Bedrag</th>
                        <th>Datum</th>
                        <th>Omschrijving</th>
                    </tr>
                </thead>
                <tbody>`;
            
            categoriesData.forEach(([category, categoryData]) => {
                const percentage = (categoryData.total / totaalOperationeel * 100).toFixed(1);
                const categoryId = category.replace(/\s+/g, '_');
                const rowClass = category === 'VENNOOTSCHAPPEN MDN' ? 'mdn-row category-header' : 'category-header';
                
                tableHTML += `
                    <tr class="${rowClass}" onclick="toggleCategory('${categoryId}')" style="cursor: pointer;">
                        <td>
                            <span class="expand-icon" id="icon_${categoryId}">▶</span> 
                            <strong>${category}</strong> (${categoryData.count} transacties)
                        </td>
                        <td class="amount"><strong>€ ${formatNumber(categoryData.total)}</strong> (${percentage}%)</td>
                        <td colspan="2"></td>
                    </tr>
                `;
                
                // Suppliers for this category
                const sortedSuppliers = Object.entries(categoryData.suppliers)
                    .sort((a, b) => b[1].total - a[1].total);
                
                sortedSuppliers.forEach(([supplier, supplierData]) => {
                    const supplierId = `${categoryId}_${supplier.replace(/\s+/g, '_')}`;
                    
                    tableHTML += `
                        <tr class="sub-row" style="display: none;" data-category="${categoryId}" onclick="toggleSupplier('${supplierId}')" style="cursor: pointer;">
                            <td>
                                <span class="expand-icon" id="icon_${supplierId}">▶</span> 
                                ${supplier} (${supplierData.count} transacties)
                            </td>
                            <td class="amount">€ ${formatNumber(supplierData.total)}</td>
                            <td colspan="2"></td>
                        </tr>
                    `;
                    
                    // Transactions for this supplier
                    const sortedTransactions = _.sortBy(supplierData.transactions, row => -row['Transactie Bedrag']);
                    
                    sortedTransactions.forEach(transaction => {
                        tableHTML += `
                            <tr class="detail-row" style="display: none;" data-supplier="${supplierId}">
                                <td></td>
                                <td class="amount">€ ${formatNumber(transaction['Transactie Bedrag'])}</td>
                                <td>${transaction['Transactie Datum']}</td>
                                <td>${transaction['Transactie Omschrijving'] || 'Geen omschrijving'}</td>
                            </tr>
                        `;
                    });
                });
            });
            
            tableHTML += '</tbody></table>';
            document.getElementById('categoriesContent').innerHTML = tableHTML;
        }

        // Create MDN comparison chart
        function createMDNComparisonChart() {
            const categoryTotals = _(operationalExpenses)
                .groupBy('Hoofdcategorie')
                .mapValues(group => _.sumBy(group, 'Transactie Bedrag'))
                .toPairs()
                .sortBy(pair => -pair[1])
                .take(5)
                .value();
            
            const ctx = document.getElementById('mdnComparisonChart')?.getContext('2d');
            if (!ctx) return;
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: categoryTotals.map(([cat]) => cat),
                    datasets: [{
                        label: 'Totaal Bedrag',
                        data: categoryTotals.map(([cat, total]) => total),
                        backgroundColor: categoryTotals.map(([cat]) => 
                            cat === 'VENNOOTSCHAPPEN MDN' ? '#f59e0b' : '#3b82f6'
                        ),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const percentage = (context.parsed.y / _.sumBy(operationalExpenses, 'Transactie Bedrag') * 100).toFixed(1);
                                    return [`€ ${formatNumber(context.parsed.y)}`, `${percentage}% van totaal`];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '€ ' + formatNumber(value);
                                }
                            }
                        }
                    }
                }
            });
        }

            supplierTotals.forEach(([supplier, data], index) => {
                const average = data.total / data.count;
                const rowClass = data.category === 'VENNOOTSCHAPPEN MDN' ? 'mdn-row' : '';
                
                html += `
                    <tr class="${rowClass}" onclick="showSupplierTransactions('${supplier}')" style="cursor: pointer;">
                        <td>${index + 1}</td>
                        <td class="clickable">${supplier}</td>
                        <td>${data.category}</td>
                        <td class="amount">€ ${formatNumber(data.total)}</td>
                        <td>${data.count}</td>
                        <td class="amount">€ ${formatNumber(average)}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('suppliers').innerHTML = html;
        }
        
        // Render monthly tab
        function renderMonthlyTab() {
            const monthlyData = _(operationalExpenses)
                .groupBy('Transactie Maand')
                .mapValues(group => {
                    const categoryTotals = _(group)
                        .groupBy('Hoofdcategorie')
                        .mapValues(catGroup => _.sumBy(catGroup, 'Transactie Bedrag'))
                        .value();
                    
                    return {
                        total: _.sumBy(group, 'Transactie Bedrag'),
                        count: group.length,
                        categories: categoryTotals,
                        transactions: group
                    };
                })
                .toPairs()
                .sortBy(0)
                .value();
            
            let html = `
                <div class="info-box">
                    <div class="info-box-icon">📅</div>
                    <div class="info-box-text">
                        Maandelijks overzicht van alle operationele uitgaven. Klik op een maand voor gedetailleerde transacties.
                    </div>
                </div>
                
                <table class="pivot-table">
                    <thead>
                        <tr>
                            <th>Maand</th>
                            <th class="amount">Totaal Uitgaven</th>
                            <th>Aantal Transacties</th>
                            <th>Grootste Categorie</th>
                            <th class="amount">MDN Kosten</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            let yearTotal = 0;
            let yearCount = 0;
            let yearMDN = 0;
            
            monthlyData.forEach(([month, data]) => {
                const largestCategory = Object.entries(data.categories)
                    .sort((a, b) => b[1] - a[1])[0];
                const mdnAmount = data.categories['VENNOOTSCHAPPEN MDN'] || 0;
                
                yearTotal += data.total;
                yearCount += data.count;
                yearMDN += mdnAmount;
                
                html += `
                    <tr onclick="showMonthDetails('${month}')" style="cursor: pointer;">
                        <td class="clickable">${formatMonth(month)}</td>
                        <td class="amount">€ ${formatNumber(data.total)}</td>
                        <td>${data.count}</td>
                        <td>${largestCategory ? largestCategory[0] : '-'}</td>
                        <td class="amount ${mdnAmount > 0 ? 'mdn-highlight' : ''}">
                            ${mdnAmount > 0 ? '€ ' + formatNumber(mdnAmount) : '-'}
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    <tr class="category-header">
                        <td><strong>TOTAAL JAAR</strong></td>
                        <td class="amount"><strong>€ ${formatNumber(yearTotal)}</strong></td>
                        <td><strong>${yearCount}</strong></td>
                        <td>-</td>
                        <td class="amount"><strong>€ ${formatNumber(yearMDN)}</strong></td>
                    </tr>
                </tbody>
            </table>
            
            <div class="chart-container" style="margin-top: 30px;">
                <h3 class="chart-title">Uitgaven per Categorie per Maand</h3>
                <canvas id="monthlyStackedChart" style="max-height: 300px;"></canvas>
            </div>
            `;
            
            document.getElementById('monthly').innerHTML = html;
            
            // Create stacked chart
            setTimeout(() => createMonthlyStackedChart(monthlyData), 100);
        }
        
        // Create monthly stacked chart
        function createMonthlyStackedChart(monthlyData) {
            const ctx = document.getElementById('monthlyStackedChart')?.getContext('2d');
            if (!ctx) return;
            
            // Get all unique categories
            const allCategories = _.uniq(
                monthlyData.flatMap(([month, data]) => Object.keys(data.categories))
            ).sort();
            
            // Prepare datasets
            const datasets = allCategories.map((category, index) => {
                const colors = {
                    'VENNOOTSCHAPPEN MDN': '#f59e0b',
                    'GAS EN ELEKTRICITEIT': '#ef4444',
                    'ONDERHOUD': '#3b82f6',
                    'WATER': '#06b6d4',
                    'PERSONEEL': '#8b5cf6',
                    'VERZEKERINGEN': '#10b981',
                    'SCHOONMAAK': '#f97316'
                };
                
                const defaultColors = ['#84cc16', '#a855f7', '#ec4899', '#14b8a6', '#f43f5e'];
                const color = colors[category] || defaultColors[index % defaultColors.length];
                
                return {
                    label: category,
                    data: monthlyData.map(([month, data]) => data.categories[category] || 0),
                    backgroundColor: color,
                    borderWidth: 0
                };
            });
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthlyData.map(([month]) => formatMonth(month)),
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            stacked: true
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '€ ' + formatNumber(value);
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 10,
                                font: {
                                    size: 11
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y;
                                    const total = context.chart.data.datasets.reduce((sum, dataset) => {
                                        return sum + dataset.data[context.dataIndex];
                                    }, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${context.dataset.label}: € ${formatNumber(value)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Render search tab
        function renderSearchTab() {
            let html = `
                <div class="info-box">
                    <div class="info-box-icon">🔍</div>
                    <div class="info-box-text">
                        Zoek in alle transacties op leverancier, categorie, bedrag of omschrijving.
                    </div>
                </div>
                
                <div class="search-container">
                    <input type="text" 
                           class="search-input" 
                           id="searchInput" 
                           placeholder="Zoek op leverancier, categorie, bedrag of omschrijving..."
                           onkeyup="performSearch()">
                </div>
                
                <div id="searchResults"></div>
            `;
            
            document.getElementById('search').innerHTML = html;
        }
        
        // Perform search
        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }
            
            const results = allData.filter(row => {
                const searchFields = [
                    row['Hoofdcategorie'],
                    row['Subcategorie (Levarancier/Ontvanger)'],
                    row['Transactie Omschrijving'],
                    row['Naam tegenpartij'],
                    row['Transactie Bedrag']?.toString()
                ];
                
                return searchFields.some(field => 
                    field && field.toString().toLowerCase().includes(searchTerm)
                );
            });
            
            let html = `
                <p style="margin: 20px 0; color: #64748b;">
                    ${results.length} resultaten gevonden
                </p>
                
                <table class="pivot-table">
                    <thead>
                        <tr>
                            <th>Datum</th>
                            <th>Type</th>
                            <th>Categorie</th>
                            <th>Leverancier/Ontvanger</th>
                            <th class="amount">Bedrag</th>
                            <th>Omschrijving</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            results.slice(0, 100).forEach(row => {
                const isIncome = row['Type Betaling (In/Uit)'] === 'INKOMENDE BETALING';
                const amountClass = isIncome ? 'positive' : 'negative';
                
                html += `
                    <tr>
                        <td>${row['Transactie Datum']}</td>
                        <td>${row['Boekhoudkunidg Type']}</td>
                        <td>${row['Hoofdcategorie']}</td>
                        <td>${row['Subcategorie (Levarancier/Ontvanger)']}</td>
                        <td class="amount ${amountClass}">
                            ${isIncome ? '+' : '-'} € ${formatNumber(row['Transactie Bedrag'])}
                        </td>
                        <td>${row['Transactie Omschrijving'] || '-'}</td>
                    </tr>
                `;
            });
            
            if (results.length > 100) {
                html += `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 20px; color: #64748b;">
                            Alleen de eerste 100 resultaten worden getoond
                        </td>
                    </tr>
                `;
            }
            
            html += '</tbody></table>';
            document.getElementById('searchResults').innerHTML = html;
        }
        
        // Helper functions
        function formatNumber(num) {
            return new Intl.NumberFormat('nl-BE', { 
                minimumFractionDigits: 2,
                maximumFractionDigits: 2 
            }).format(num);
        }
        
        function formatMonth(monthStr) {
            const [year, month] = monthStr.split('-');
            const months = ['Jan', 'Feb', 'Mrt', 'Apr', 'Mei', 'Jun', 
                          'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
            return `${months[parseInt(month) - 1]} ${year}`;
        }
        
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
        }
        
        function toggleCategory(categoryId) {
            const icon = document.getElementById(`icon_${categoryId}`);
            const rows = document.querySelectorAll(`[data-category="${categoryId}"]`);
            
            const isExpanded = icon.textContent === '▼';
            icon.textContent = isExpanded ? '▶' : '▼';
            icon.classList.toggle('expanded');
            
            rows.forEach(row => {
                row.style.display = isExpanded ? 'none' : 'table-row';
                // Also hide supplier details when closing category
                if (isExpanded) {
                    const supplierRows = document.querySelectorAll(`[data-supplier^="${categoryId}"]`);
                    supplierRows.forEach(sr => {
                        sr.style.display = 'none';
                        // Reset supplier icons
                        const supplierId = sr.getAttribute('data-supplier');
                        const supplierIcon = document.getElementById(`icon_${supplierId}`);
                        if (supplierIcon) {
                            supplierIcon.textContent = '▶';
                            supplierIcon.classList.remove('expanded');
                        }
                    });
                }
            });
        }
        
        function toggleSupplier(supplierId) {
            event.stopPropagation(); // Prevent triggering parent row click
            
            const icon = document.getElementById(`icon_${supplierId}`);
            const rows = document.querySelectorAll(`[data-supplier="${supplierId}"]`);
            
            const isExpanded = icon.textContent === '▼';
            icon.textContent = isExpanded ? '▶' : '▼';
            icon.classList.toggle('expanded');
            
            rows.forEach(row => {
                row.style.display = isExpanded ? 'none' : 'table-row';
            });
        }
        
        // Show category details with smooth scrolling
        function showCategoryDetails(category) {
            // Switch to categories tab
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-button')[1].classList.add('active'); // Categories is second tab
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById('categories').classList.add('active');
            
            const categoryId = category.replace(/\s+/g, '_');
            
            // Auto-expand the category after a short delay
            setTimeout(() => {
                const icon = document.getElementById(`icon_${categoryId}`);
                if (icon && icon.textContent === '▶') {
                    toggleCategory(categoryId);
                }
                
                // Smooth scroll to category
                const categoryRow = document.querySelector(`tr[onclick="toggleCategory('${categoryId}')"]`);
                if (categoryRow) {
                    categoryRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // Highlight the row briefly
                    categoryRow.style.backgroundColor = '#fef3c7';
                    setTimeout(() => {
                        categoryRow.style.backgroundColor = '';
                    }, 2000);
                }
            }, 100);
        }
        
        function showSupplierTransactions(supplier) {
            const transactions = operationalExpenses.filter(row => 
                row['Subcategorie (Levarancier/Ontvanger)'] === supplier
            );
            
            let modalHTML = `
                <h3>${supplier}</h3>
                <p style="margin-bottom: 20px;">
                    <strong>Totaal:</strong> € ${formatNumber(_.sumBy(transactions, 'Transactie Bedrag'))}<br>
                    <strong>Aantal transacties:</strong> ${transactions.length}<br>
                    <strong>Categorie:</strong> ${transactions[0]['Hoofdcategorie']}
                </p>
                
                <table class="pivot-table">
                    <thead>
                        <tr>
                            <th>Datum</th>
                            <th class="amount">Bedrag</th>
                            <th>Omschrijving</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            _.sortBy(transactions, row => {
                const parts = row['Transactie Datum'].split('/');
                return new Date(parts[2], parts[1]-1, parts[0]);
            }).forEach(transaction => {
                modalHTML += `
                    <tr>
                        <td>${transaction['Transactie Datum']}</td>
                        <td class="amount">€ ${formatNumber(transaction['Transactie Bedrag'])}</td>
                        <td>${transaction['Transactie Omschrijving'] || 'Geen omschrijving'}</td>
                    </tr>
                `;
            });
            
            modalHTML += '</tbody></table>';
            
            document.getElementById('modalBody').innerHTML = modalHTML;
            document.getElementById('transactionModal').style.display = 'block';
        }
        
        function showMonthDetails(month) {
            const monthTransactions = operationalExpenses.filter(row => 
                row['Transactie Maand'] === month
            );
            
            const byCategory = _(monthTransactions)
                .groupBy('Hoofdcategorie')
                .mapValues(group => ({
                    total: _.sumBy(group, 'Transactie Bedrag'),
                    count: group.length
                }))
                .toPairs()
                .sortBy(pair => -pair[1].total)
                .value();
            
            let modalHTML = `
                <h3>${formatMonth(month)}</h3>
                <p style="margin-bottom: 20px;">
                    <strong>Totaal uitgaven:</strong> € ${formatNumber(_.sumBy(monthTransactions, 'Transactie Bedrag'))}<br>
                    <strong>Aantal transacties:</strong> ${monthTransactions.length}
                </p>
                
                <h4>Per Categorie</h4>
                <table class="pivot-table">
                    <thead>
                        <tr>
                            <th>Categorie</th>
                            <th class="amount">Bedrag</th>
                            <th>Aantal</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            byCategory.forEach(([category, data]) => {
                const rowClass = category === 'VENNOOTSCHAPPEN MDN' ? 'mdn-row' : '';
                modalHTML += `
                    <tr class="${rowClass}">
                        <td>${category}</td>
                        <td class="amount">€ ${formatNumber(data.total)}</td>
                        <td>${data.count}</td>
                    </tr>
                `;
            });
            
            modalHTML += '</tbody></table>';
            
            document.getElementById('modalBody').innerHTML = modalHTML;
            document.getElementById('transactionModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('transactionModal').style.display = 'none';
        }
        
        function downloadSuppliersList() {
            const supplierData = _(operationalExpenses)
                .groupBy('Subcategorie (Levarancier/Ontvanger)')
                .mapValues(group => ({
                    total: _.sumBy(group, 'Transactie Bedrag'),
                    count: group.length,
                    category: group[0]['Hoofdcategorie']
                }))
                .toPairs()
                .sortBy(pair => -pair[1].total)
                .map(([supplier, data]) => ({
                    Leverancier: supplier,
                    Hoofdcategorie: data.category,
                    'Totaal Bedrag': data.total,
                    'Aantal Betalingen': data.count,
                    'Gemiddeld Bedrag': data.total / data.count
                }))
                .value();
            
            const csv = Papa.unparse(supplierData, {
                header: true,
                delimiter: ';'
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'leveranciers_residentie_helix.csv';
            link.click();
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('transactionModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
